[project]
name = "clima"
version = "0.10.2"
requires-python = ">=3.11"
dependencies = [
    "dash==3.2.0",
    "dash-bootstrap-components==1.2.0",
    "dash-extensions==1.0.7",
    "dash-iconify==0.1.2",
    "dash-leaflet==1.0.15",
    "dash-mantine-components==2.2.1",
    "kgcpy==1.1.8",
    "numpy==1.26.3",
    "pandas==2.2.0",
    "plotly==5.18.0",
    "pvlib==0.9.1",
    "pythermalcomfort==2.9.1",
    "requests==2.32.4",
    "scipy==1.12.0",
]

[dependency-groups]
dev = [
    "black==26.3.1",
    "bump2version==1.0.1",
    "cleanpy==0.5.1",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-playwright==0.7.2",
    "pytest-xdist==3.8.0",
    "ruff==0.15.12",
]

[tool.uv]
# Keep transitive packages on the major (or, for 0.x, minor) versions that the old
# Pipfile.lock used. Unconstrained resolution moved each of these across a major
# version, which the pinned direct dependencies were never tested against.
constraint-dependencies = [
    "filelock<4",
    "llvmlite<0.48",
    "numba<0.66",
    "pillow<13",
    "pyee<14",
    "python-dateutil<3",
    "setuptools<83",
]
