[bumpversion]
current_version = 0.10.2
commit = True
tag = True

[bumpversion:file:pages/lib/layout.py]
search = Version: {current_version}
replace = Version: {new_version}

[bumpversion:file:assets/manifest.json]
search = "id": "{current_version}"
replace = "id": "{new_version}"

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:uv.lock]
search = name = "clima"
	version = "{current_version}"
replace = name = "clima"
	version = "{new_version}"
